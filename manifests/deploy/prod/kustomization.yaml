apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: product-profile
resources:
  - ../base
components:
  - ../../image/prod

patches:
  - patch: |-
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: altinn-profile
      spec:
        hostnames:
          - profile.prod.dis-core.altinn.cloud
