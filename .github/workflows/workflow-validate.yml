name: Validate

# Builds every overlay and checks that each environment's syncroot points at itself and that
# the pinned app image exists. The same script can be run locally: scripts/validate.sh.
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate. Empty means the commit the calling workflow runs on.
        type: string
        default: ''

permissions: {}

jobs:
  validate:
    name: Validate overlays and pinned image tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Validate
        run: scripts/validate.sh
