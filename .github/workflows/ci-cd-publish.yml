name: Publish
run-name: Publish ${{ github.sha }}

# Publishes the artifacts for every commit on main that changes the config, and moves the AT22 and
# AT23 tags onto them. Those two deploy automatically. YT01, TT02 and PROD only change when
# someone runs dispatch-deploy.yml.
#
# A manual run can move just one of the two tags. A push always moves both.
on:
  push:
    branches:
      - main
    paths:
      - 'manifests/**'
      - 'flux/**'
      - '.github/workflows/ci-cd-publish.yml'
      - '.github/workflows/workflow-publish-artifacts.yml'
      - '.github/workflows/workflow-promote.yml'
  workflow_dispatch:
    inputs:
      environments:
        description: Environments to move onto this commit.
        type: choice
        options:
          - both
          - at22
          - at23
        default: both

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/workflow-publish-artifacts.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      id-token: write
    secrets:
      DIS_SYNCROOT_AZURE_CLIENT_ID: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
      DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
      DIS_SYNCROOT_AZURE_TENANT_ID: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}

  promote:
    name: Deploy to ${{ matrix.environment }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environments == 'at22' && '["at22"]' || inputs.environments == 'at23' && '["at23"]' || '["at22","at23"]') }}
    uses: ./.github/workflows/workflow-promote.yml
    with:
      environment: ${{ matrix.environment }}
      tag: ${{ needs.publish.outputs.short_sha }}
    permissions:
      contents: read
      id-token: write
    secrets:
      DIS_SYNCROOT_AZURE_CLIENT_ID: ${{ secrets.DIS_SYNCROOT_AZURE_CLIENT_ID }}
      DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID: ${{ secrets.DIS_SYNCROOT_AZURE_SUBSCRIPTION_ID }}
      DIS_SYNCROOT_AZURE_TENANT_ID: ${{ secrets.DIS_SYNCROOT_AZURE_TENANT_ID }}
